name: Build & Deploy R binaries

on:
  push:
    branches:
      - stable

permissions:
  contents: write
  actions: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
        r-version: ["4.4", "4.5"]

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ matrix.r-version }}
        extra-repositories: "https://inla.r-inla-download.org/R/testing"

    - name: Install build deps
      run: Rscript -e 'install.packages(c("devtools"), repos="https://cloud.r-project.org")'

    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        dependencies: '"all"'

    - name: Install LLVM for OpenMP (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        # Install LLVM@18 and libomp
        brew install llvm@18 libomp
        
        # Verify installation paths
        echo "LLVM@18 installed at: $(brew --prefix llvm@18)"
        echo "libomp installed at: $(brew --prefix libomp)"
        
        # Check library files
        ls -la $(brew --prefix llvm@18)/lib | grep -i omp
        ls -la $(brew --prefix libomp)/lib

    - name: Configure compiler to use LLVM (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        LLVM_PREFIX=$(brew --prefix llvm@18)
        echo "PATH=$LLVM_PREFIX/bin:$PATH" >> $GITHUB_ENV
        echo "CC=$LLVM_PREFIX/bin/clang" >> $GITHUB_ENV
        echo "CXX=$LLVM_PREFIX/bin/clang++" >> $GITHUB_ENV

    - name: Setup OpenMP to link R-provided libomp (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        export R_FRAMEWORK_PATH=$(R RHOME)
        LLVM_PREFIX=$(brew --prefix llvm@18)
        LIBOMP_PREFIX=$(brew --prefix libomp)
        
        mkdir -p ~/.R
        
        # Create a comprehensive Makevars file with LLVM@18 with dynamic paths
        cat > ~/.R/Makevars << EOF
        # Use Homebrew LLVM's clang compiler (supports OpenMP)
        CC=$(brew --prefix llvm@18)/bin/clang
        CXX=$(brew --prefix llvm@18)/bin/clang++
        CXX11=$(brew --prefix llvm@18)/bin/clang++
        CXX14=$(brew --prefix llvm@18)/bin/clang++
        CXX17=$(brew --prefix llvm@18)/bin/clang++ 
        CXX20=$(brew --prefix llvm@18)/bin/clang++

        # Add OpenMP flags
        SHLIB_OPENMP_CFLAGS = -fopenmp
        SHLIB_OPENMP_CXXFLAGS = -fopenmp
        SHLIB_OPENMP_FFLAGS = -fopenmp

        # Include and library paths for LLVM and OpenMP
        CFLAGS += -I$(brew --prefix llvm@18)/include -I$(brew --prefix libomp)/include
        CXXFLAGS += -I$(brew --prefix llvm@18)/include -I$(brew --prefix libomp)/include
        
        # Use -rpath with @rpath notation for better portability
        LDFLAGS += -L$(brew --prefix llvm@18)/lib -L$(brew --prefix llvm@18)/lib/c++ -L$(brew --prefix libomp)/lib -Wl,-rpath,@loader_path/../lib -Wl,-rpath,@loader_path/../../lib -lomp

        # Set FLIBS for Fortran
        FLIBS = -L$(brew --prefix gcc)/lib/gcc/current -lgfortran -lquadmath
        EOF
        
        # Display the contents of Makevars
        echo "Contents of ~/.R/Makevars:"
        cat ~/.R/Makevars
        
        # For debugging - show the actual paths
        echo "Actual paths:"
        echo "LLVM_PREFIX: $LLVM_PREFIX"
        echo "LIBOMP_PREFIX: $LIBOMP_PREFIX"

    - name: Build source package (all platforms)
      run: |
        # Build source package without vignettes
        R CMD build --no-build-vignettes --no-manual .
      shell: bash

    - name: Install & build binary (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        # Set paths from Homebrew
        LLVM_PREFIX=$(brew --prefix llvm@18)
        LIBOMP_PREFIX=$(brew --prefix libomp)
        R_HOME=$(R RHOME)
        
        # Set environment variables for the build
        export PATH="$LLVM_PREFIX/bin:$PATH"
        export CC="$LLVM_PREFIX/bin/clang"
        export CXX="$LLVM_PREFIX/bin/clang++"
        export CFLAGS="-fopenmp -I$LLVM_PREFIX/include -I$LIBOMP_PREFIX/include"
        export CXXFLAGS="-fopenmp -I$LLVM_PREFIX/include -I$LIBOMP_PREFIX/include"
        
        # Improve portability with @rpath and avoid hardcoded paths
        export LDFLAGS="-L$LLVM_PREFIX/lib -L$LIBOMP_PREFIX/lib -lomp -Wl,-rpath,@loader_path/../Resources/lib"
        export DYLD_FALLBACK_LIBRARY_PATH="$LIBOMP_PREFIX/lib:$LLVM_PREFIX/lib:$R_HOME/lib:/usr/local/lib:/usr/lib"
        
        # Show actual paths for debugging
        echo "Paths in use:"
        echo "LLVM_PREFIX: $LLVM_PREFIX"
        echo "LIBOMP_PREFIX: $LIBOMP_PREFIX" 
        echo "R_HOME: $R_HOME"
        echo "DYLD_FALLBACK_LIBRARY_PATH: $DYLD_FALLBACK_LIBRARY_PATH"
        
        # Build the binary package without vignettes
        echo "Building binary package with LLVM@18..."
        R CMD INSTALL --build --no-build-vignettes --no-docs --no-html --no-multiarch $(ls -t *.tar.gz | head -n 1)
        
        # Check for OpenMP in the built package
        BUILT_PKG=$(ls -t *.tgz | head -n 1)
        echo "Created binary package: $BUILT_PKG"
        
        # Extract and check the .so file
        mkdir -p check_pkg
        tar -xzf "$BUILT_PKG" -C check_pkg
        if [ -f check_pkg/ngme2/libs/ngme2.so ]; then
          echo "Checking .so dependencies:"
          otool -L check_pkg/ngme2/libs/ngme2.so
          
          # Fix library paths to improve portability
          echo "Patching library paths in ngme2.so..."
          install_name_tool -change "$LLVM_PREFIX/lib/c++/libc++.1.dylib" "@rpath/libc++.1.dylib" check_pkg/ngme2/libs/ngme2.so || echo "Failed to patch libc++ path"
          install_name_tool -change "$LIBOMP_PREFIX/lib/libomp.dylib" "@rpath/libomp.dylib" check_pkg/ngme2/libs/ngme2.so || echo "Failed to patch libomp path"
          
          # Copy necessary libraries to package lib directory
          mkdir -p check_pkg/ngme2/libs/Resources/lib
          cp "$LLVM_PREFIX/lib/c++/libc++.1.dylib" check_pkg/ngme2/libs/Resources/lib/ || echo "Failed to copy libc++.1.dylib"
          cp "$LIBOMP_PREFIX/lib/libomp.dylib" check_pkg/ngme2/libs/Resources/lib/ || echo "Failed to copy libomp.dylib"
          
          # Verify patched libraries
          echo "Dependencies after patching:"
          otool -L check_pkg/ngme2/libs/ngme2.so
          
          # Repack the binary package with bundled libraries
          cd check_pkg
          tar -czf "../$BUILT_PKG" ngme2
          cd ..
        fi
      shell: bash

    - name: Install & build binary (Win only)
      if: matrix.os == 'windows-latest'
      run: |
        R CMD INSTALL --build --no-build-vignettes --no-docs --no-html --no-multiarch $(ls -t *.tar.gz | head -n 1)
      shell: bash

    - name: Upload Windows binary
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: binary-windows-r${{ matrix.r-version }}
        path: "*.zip"

    - name: Upload macOS binary
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: binary-macos-r${{ matrix.r-version }}
        path: "*.tgz"

    - name: Upload Linux source
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: source-linux-r${{ matrix.r-version }}
        path: "*.tar.gz"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout gh-pages branch
      uses: actions/checkout@v3
      with:
        ref: gh-pages

    - name: Setup R
      uses: r-lib/actions/setup-r@v2

    - name: Create directory structure
      run: |
        mkdir -p .binaries/bin/windows/contrib/4.4
        mkdir -p .binaries/bin/windows/contrib/4.5
        mkdir -p .binaries/bin/macosx/big-sur-arm64/contrib/4.4
        mkdir -p .binaries/bin/macosx/big-sur-arm64/contrib/4.5
        mkdir -p .binaries/src/contrib

    # Download Windows binaries
    - name: Download Windows r4.4
      uses: actions/download-artifact@v4
      with:
        name: binary-windows-r4.4
        path: .binaries/bin/windows/contrib/4.4
    - name: Download Windows r4.5
      uses: actions/download-artifact@v4
      with:
        name: binary-windows-r4.5
        path: .binaries/bin/windows/contrib/4.5

    # Download macOS binaries
    - name: Download macOS r4.4
      uses: actions/download-artifact@v4
      with:
        name: binary-macos-r4.4
        path: .binaries/bin/macosx/big-sur-arm64/contrib/4.4
    - name: Download macOS r4.5
      uses: actions/download-artifact@v4
      with:
        name: binary-macos-r4.5
        path: .binaries/bin/macosx/big-sur-arm64/contrib/4.5

    # Download Linux source
    - name: Download source r4.4
      uses: actions/download-artifact@v4
      with:
        name: source-linux-r4.4
        path: .binaries/src/contrib
    - name: Download source r4.5
      uses: actions/download-artifact@v4
      with:
        name: source-linux-r4.5
        path: .binaries/src/contrib

    - name: Create .nojekyll (allow dot-folders)
      run: touch .nojekyll

    - name: Generate PACKAGES indices
      run: |
        Rscript -e 'tools::write_PACKAGES(".binaries/src/contrib", type="source")'
        Rscript -e 'tools::write_PACKAGES(".binaries/bin/windows/contrib/4.4", type="win.binary")'
        Rscript -e 'tools::write_PACKAGES(".binaries/bin/windows/contrib/4.5", type="win.binary")'
        Rscript -e 'tools::write_PACKAGES(".binaries/bin/macosx/big-sur-arm64/contrib/4.4", type="mac.binary")'
        Rscript -e 'tools::write_PACKAGES(".binaries/bin/macosx/big-sur-arm64/contrib/4.5", type="mac.binary")'

    - name: Commit & Push
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "🚀 Update binaries for $(date +%Y-%m-%d) [skip ci]" || echo "No changes to commit"
        git push origin gh-pages