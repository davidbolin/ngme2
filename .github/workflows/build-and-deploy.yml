name: Build & Deploy R binaries

on:
  push:
    branches:
      - stable

permissions:
  contents: write
  actions: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # os: [windows-latest, macos-latest, ubuntu-latest]
        # r-version: ["4.4", "4.5"]
        os: [macos-latest]
        r-version: ["4.5"]

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ matrix.r-version }}
        extra-repositories: "https://inla.r-inla-download.org/R/testing"

    - name: Install build deps
      run: Rscript -e 'install.packages(c("devtools"), repos="https://cloud.r-project.org")'

    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        dependencies: '"all"'

    - name: Install LLVM for OpenMP (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        # Install LLVM and libomp explicitly
        brew install llvm libomp
        
        # Check installed OpenMP libraries
        echo "Checking installed OpenMP libraries:"
        ls -la $(brew --prefix libomp)/lib/

    - name: Create Makevars with explicit libomp config (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        # Get brew paths
        LLVM_PREFIX=$(brew --prefix llvm)
        LIBOMP_PREFIX=$(brew --prefix libomp)
        
        # Create ~/.R/Makevars with explicit settings
        mkdir -p ~/.R
        
        # Create a very explicit Makevars file
        cat > ~/.R/Makevars << EOF
        # Use LLVM clang compilers
        CC=$(which clang)
        CXX=$(which clang++)
        
        # OpenMP flags - use brew libomp explicitly
        CPPFLAGS=-I${LIBOMP_PREFIX}/include
        CFLAGS=-I${LIBOMP_PREFIX}/include -fopenmp
        CXXFLAGS=-I${LIBOMP_PREFIX}/include -fopenmp
        
        # Linker flags - explicit paths to libomp
        LDFLAGS=-L${LIBOMP_PREFIX}/lib -Wl,-rpath,${LIBOMP_PREFIX}/lib -lomp
        EOF
        
        # Display the created Makevars file
        echo "Created ~/.R/Makevars:"
        cat ~/.R/Makevars

    - name: Create custom OpenMP test (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        # Create a simple OpenMP test program
        cat > openmp_test.cpp << EOF
        #include <omp.h>
        #include <stdio.h>
        int main() {
          int nthreads, tid;
          #pragma omp parallel private(tid)
          {
            tid = omp_get_thread_num();
            printf("Hello, world from thread = %d\\n", tid);
            if (tid == 0) {
              nthreads = omp_get_num_threads();
              printf("Number of threads = %d\\n", nthreads);
            }
          }
          return 0;
        }
        EOF
        
        # Compile and run the test program
        LIBOMP_PREFIX=$(brew --prefix libomp)
        clang++ -I${LIBOMP_PREFIX}/include -L${LIBOMP_PREFIX}/lib -Wl,-rpath,${LIBOMP_PREFIX}/lib -fopenmp openmp_test.cpp -o openmp_test
        
        # Run the test
        echo "Running OpenMP test:"
        ./openmp_test
        
        # Check for OpenMP symbols
        nm -g ${LIBOMP_PREFIX}/lib/libomp.dylib | grep kmpc_dispatch_deinit || echo "Symbol not found in brew libomp"

    - name: Build source package (all platforms)
      run: |
        R CMD build .
      shell: bash

    - name: Manual build with explicit flags (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        # Get libomp path
        LIBOMP_PREFIX=$(brew --prefix libomp)
        
        # Extract the source package
        PKGFILE=$(ls -t *.tar.gz | head -n 1)
        tar xf $PKGFILE
        cd ngme2
        
        # Manually invoke installation with explicit flags
        DYLD_FALLBACK_LIBRARY_PATH=${LIBOMP_PREFIX}/lib:/usr/local/lib:/usr/lib \
        DYLD_LIBRARY_PATH=${LIBOMP_PREFIX}/lib:/usr/local/lib \
        R CMD INSTALL \
          --configure-args="--with-openmp-include=${LIBOMP_PREFIX}/include --with-openmp-lib=${LIBOMP_PREFIX}/lib" \
          --no-test-load \
          .
        
        # Find the shared object
        find . -name "*.so" -type f
        
        # Go back to the parent directory
        cd ..
        
        # Create the binary package
        R CMD INSTALL --build $PKGFILE
      shell: bash

    - name: Upload Windows binary
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: binary-windows-r${{ matrix.r-version }}
        path: "*.zip"

    - name: Upload macOS binary
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: binary-macos-r${{ matrix.r-version }}
        path: "*.tgz"

    - name: Upload Linux source
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: source-linux-r${{ matrix.r-version }}
        path: "*.tar.gz"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout gh-pages branch
      uses: actions/checkout@v3
      with:
        ref: gh-pages

    - name: Setup R
      uses: r-lib/actions/setup-r@v2

    - name: Create directory structure
      run: |
        mkdir -p .binaries/bin/windows/contrib/4.4
        mkdir -p .binaries/bin/windows/contrib/4.5
        mkdir -p .binaries/bin/macosx/big-sur-arm64/contrib/4.4
        mkdir -p .binaries/bin/macosx/big-sur-arm64/contrib/4.5
        mkdir -p .binaries/src/contrib
    # 下载 Windows binaries
    - name: Download Windows r4.4
      uses: actions/download-artifact@v4
      with:
        name: binary-windows-r4.4
        path: .binaries/bin/windows/contrib/4.4
    - name: Download Windows r4.5
      uses: actions/download-artifact@v4
      with:
        name: binary-windows-r4.5
        path: .binaries/bin/windows/contrib/4.5

    # 下载 macOS binaries
    - name: Download macOS r4.4
      uses: actions/download-artifact@v4
      with:
        name: binary-macos-r4.4
        path: .binaries/bin/macosx/big-sur-arm64/contrib/4.4
    - name: Download macOS r4.5
      uses: actions/download-artifact@v4
      with:
        name: binary-macos-r4.5
        path: .binaries/bin/macosx/big-sur-arm64/contrib/4.5

    # 下载 Linux source
    - name: Download source r4.4
      uses: actions/download-artifact@v4
      with:
        name: source-linux-r4.4
        path: .binaries/src/contrib
    - name: Download source r4.5
      uses: actions/download-artifact@v4
      with:
        name: source-linux-r4.5
        path: .binaries/src/contrib

    - name: Create .nojekyll (allow dot-folders)
      run: touch .nojekyll

    - name: Generate PACKAGES indices
      run: |
        Rscript -e 'tools::write_PACKAGES(".binaries/src/contrib", type="source")'
        Rscript -e 'tools::write_PACKAGES(".binaries/bin/windows/contrib/4.4", type="win.binary")'
        Rscript -e 'tools::write_PACKAGES(".binaries/bin/windows/contrib/4.5", type="win.binary")'
        Rscript -e 'tools::write_PACKAGES(".binaries/bin/macosx/big-sur-arm64/contrib/4.4", type="mac.binary")'
        Rscript -e 'tools::write_PACKAGES(".binaries/bin/macosx/big-sur-arm64/contrib/4.5", type="mac.binary")'
    - name: Commit & Push
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "🚀 Update binaries for $(date +%Y-%m-%d) [skip ci]" || echo "No changes to commit"
        git push origin gh-pages