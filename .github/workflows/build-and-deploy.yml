name: Build & Deploy R binaries

on:
  push:
    branches:
      - stable

permissions:
  contents: read    # 用来 clone 你的仓库
  actions: read     # 允许下载并执行 Marketplace 上的 Actions（例如 upload-artifact）
  packages: write   # 如果你需要读/写 GitHub Packages

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Setup R
      uses: r-lib/actions/setup-r@v2

    - name: Install build deps
      run: Rscript -e 'install.packages(c("devtools"), repos="https://cloud.r-project.org")'

    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        dependencies: '"all"'

    - name: Build & pack binary
      run: |
        R CMD build .
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          R CMD INSTALL --build ngme2.0.0.tar.gz  
        elif [ "${{ matrix.os }}" = "macos-latest" ]; then
          R CMD INSTALL --build ngme2.0.0.tar.gz  
        else
          R CMD INSTALL --build ngme2.0.0.tar.gz
        fi

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.os }}
        path: |
          ngme2.0.0.zip     # Windows
          ngme2.0.0.tgz     # macOS
          ngme2.0.0.tar.gz  # Linux

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout gh-pages branch
      uses: actions/checkout@v3
      with:
        ref: gh-pages

    - name: Download binaries
      uses: actions/download-artifact@v4
      with:
        name: binary-windows-latest
        path: .binaries/bin/windows
    - uses: actions/download-artifact@v3
      with:
        name: binary-macos-latest
        path: .binaries/bin/macos

    - name: Create .nojekyll (allow dot-folders)
      run: touch .nojekyll

    - name: Generate PACKAGES index
      run: |
        Rscript -e 'tools::write_PACKAGES(" .binaries", type="both")'

    - name: Commit & Push
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Update binaries $(date +%Y-%m-%d)" || echo "No changes to commit"
        git push origin gh-pages