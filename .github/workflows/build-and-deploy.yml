name: Build & Deploy R binaries

on:
  push:
    branches:
      - stable

permissions:
  contents: write
  actions: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # os: [macos-latest, ubuntu-latest, windows-latest]
        os: [macos-latest]
        # r-version: ["4.1", "4.2", "4.3", "4.4", "4.5"]
        r-version: ["4.5"]

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ matrix.r-version }}
        extra-repositories: "https://inla.r-inla-download.org/R/testing"

    - name: Install build deps
      run: Rscript -e 'install.packages(c("devtools"), repos="https://cloud.r-project.org")'

    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        dependencies: '"all"'

    - name: Configure LLVM and OpenMP for R (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        brew install llvm
        LLVM_PREFIX=$(brew --prefix llvm)
        RFW=$(R RHOME)

        echo "PATH=$LLVM_PREFIX/bin:$PATH" >> $GITHUB_ENV
        echo "CC=$LLVM_PREFIX/bin/clang" >> $GITHUB_ENV
        echo "CXX=$LLVM_PREFIX/bin/clang++" >> $GITHUB_ENV
        echo "CFLAGS=-fopenmp -I$RFW/include" >> $GITHUB_ENV
        echo "CXXFLAGS=-fopenmp -I$RFW/include" >> $GITHUB_ENV
        echo "LDFLAGS=-fopenmp -L$RFW/lib -Wl,-rpath,$RFW/lib" >> $GITHUB_ENV
        echo "DYLD_FALLBACK_LIBRARY_PATH=$RFW/lib:/usr/local/lib:/usr/lib" >> $GITHUB_ENV

        mkdir -p ~/.R
        echo "CXXFLAGS += -fopenmp -I$RFW/include" >> ~/.R/Makevars
        echo "CFLAGS   += -fopenmp -I$RFW/include" >> ~/.R/Makevars
        echo "LDFLAGS  += -fopenmp -L$RFW/lib -Wl,-rpath,$RFW/lib" >> ~/.R/Makevars

    - name: Build source package
      run: |
        R CMD build .
      shell: bash

    - name: Install from source without test-load (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        PKG=$(ls -t *.tar.gz | head -n 1)
        R CMD INSTALL --no-multiarch --no-test-load "$PKG"

    - name: Patch OpenMP paths after install (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        RFW=$(R RHOME)
        PKGPATH=$(Rscript -e 'cat(find.package("ngme2"))')
        echo "Package installed at: $PKGPATH"

        if [ -f "$PKGPATH/libs/ngme2.so" ]; then
          echo "Found ngme2.so at $PKGPATH/libs/ngme2.so"
          otool -L "$PKGPATH/libs/ngme2.so"

          echo "Patching ngme2.so install_name..."
          install_name_tool -change @rpath/libomp.dylib "$RFW/lib/libomp.dylib" "$PKGPATH/libs/ngme2.so" || true
          install_name_tool -change libomp.dylib "$RFW/lib/libomp.dylib" "$PKGPATH/libs/ngme2.so" || true
          install_name_tool -change @loader_path/libomp.dylib "$RFW/lib/libomp.dylib" "$PKGPATH/libs/ngme2.so" || true

          echo "Dependencies after patching:"
          otool -L "$PKGPATH/libs/ngme2.so"
        else
          echo "ngme2.so not found!"
          exit 1
        fi

    - name: Build binary package from patched install (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        # 安装目录里拿到 patch 完的 so
        PKGPATH=$(Rscript -e 'cat(find.package("ngme2"))')
        echo "Patched install at: $PKGPATH"
        
        # 找到原来的源码包
        SRCPKG=$(ls -t *.tar.gz | head -n1)
        echo "Source tar.gz: $SRCPKG"
        
        # 解压源码到临时目录
        mkdir -p extracted_src
        tar -xzf "$SRCPKG" -C extracted_src
        SRC_DIR=extracted_src/ngme2
        
        # 把 patch 好的 so 放回去
        mkdir -p "$SRC_DIR/libs"
        cp "$PKGPATH/libs/ngme2.so" "$SRC_DIR/libs/"
        
        # **删除 src/ 目录**，防止 R CMD INSTALL 重新编译
        rm -rf "$SRC_DIR/src"
        
        # 最后一步：直接基于这个目录打包 binary
        R CMD INSTALL --build "$SRC_DIR"
      shell: bash

    - name: Build binary package (Windows only)
      if: matrix.os == 'windows-latest'
      run: |
        PKG=$(ls -t *.tar.gz | head -n 1)
        R CMD INSTALL --build "$PKG"
      shell: bash

    - name: Upload Windows binary
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: binary-windows-r${{ matrix.r-version }}
        path: "*.zip"

    - name: Upload macOS binary
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: binary-macos-r${{ matrix.r-version }}
        path: "*.tgz"

    - name: Upload Linux source
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: source-linux-r${{ matrix.r-version }}
        path: "*.tar.gz"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout gh-pages branch
      uses: actions/checkout@v3
      with:
        ref: gh-pages

    - name: Setup R
      uses: r-lib/actions/setup-r@v2

    - name: Create directory structure
      run: |
        mkdir -p .binaries/bin/windows/contrib/4.1
        mkdir -p .binaries/bin/windows/contrib/4.2
        mkdir -p .binaries/bin/windows/contrib/4.3
        mkdir -p .binaries/bin/windows/contrib/4.4
        mkdir -p .binaries/bin/windows/contrib/4.5
        mkdir -p .binaries/bin/macosx/big-sur-arm64/contrib/4.1
        mkdir -p .binaries/bin/macosx/big-sur-arm64/contrib/4.2
        mkdir -p .binaries/bin/macosx/big-sur-arm64/contrib/4.3
        mkdir -p .binaries/bin/macosx/big-sur-arm64/contrib/4.4
        mkdir -p .binaries/bin/macosx/big-sur-arm64/contrib/4.5
        mkdir -p .binaries/src/contrib

    # 下载 artifacts
    - name: Download all Windows binaries
      uses: actions/download-artifact@v4
      with:
        pattern: binary-windows-r*
        path: .binaries/bin/windows/contrib/

    - name: Download all macOS binaries
      uses: actions/download-artifact@v4
      with:
        pattern: binary-macos-r*
        path: .binaries/bin/macosx/big-sur-arm64/contrib/

    - name: Download all Linux sources
      uses: actions/download-artifact@v4
      with:
        pattern: source-linux-r*
        path: .binaries/src/contrib

    - name: Create .nojekyll
      run: touch .nojekyll

    - name: Generate PACKAGES indices
      run: |
        Rscript -e 'tools::write_PACKAGES(".binaries/src/contrib", type="source")'
        for v in 4.1 4.2 4.3 4.4 4.5; do
          Rscript -e "tools::write_PACKAGES('.binaries/bin/windows/contrib/$v', type='win.binary')"
          Rscript -e "tools::write_PACKAGES('.binaries/bin/macosx/big-sur-arm64/contrib/$v', type='mac.binary')"
        done

    - name: Commit & Push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "🚀 Update binaries for $(date +%Y-%m-%d) [skip ci]" || echo "No changes to commit"
        git push origin gh-pages