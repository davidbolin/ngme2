name: Build & Deploy R binaries and pkgdown

on:
  push:
    branches: [stable]

permissions:
  contents: write
  actions: read
  packages: write

# Default to bash for all runs
defaults:
  run:
    shell: bash

jobs:
  pkgdown:
    runs-on: ubuntu-22.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # ───── public preamble ─────
      - uses: actions/checkout@v3
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          extra-repositories: "https://inla.r-inla-download.org/R/testing"
      - uses: r-lib/actions/setup-pandoc@v2

      # ───── reuse Install R deps Composite Action ─────
      - name: Prepare R environment
        uses: ./.github/actions/install-r-deps
        with:
          r-version: 'release'

      # ───── install own package and deploy site ─────
      - name: Install package
        run: R CMD INSTALL .

      - name: Deploy pkgdown site
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE)'


  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        r-version: ["4.3", "4.4", "4.5"]
    steps:
      # ───── public preamble ─────
      - uses: actions/checkout@v3
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          extra-repositories: "https://inla.r-inla-download.org/R/testing"

      # ───── reuse Install R deps Composite Action ─────
      - name: Prepare R environment
        uses: ./.github/actions/install-r-deps
        with:
          r-version: ${{ matrix.r-version }}

      # ───── macOS extra configuration OpenMP ─────
      - name: Install LLVM & libomp (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install llvm@18 libomp
          echo "PATH=$(brew --prefix llvm@18)/bin:$PATH" >> $GITHUB_ENV
          echo "CC=$(brew --prefix llvm@18)/bin/clang"   >> $GITHUB_ENV
          echo "CXX=$(brew --prefix llvm@18)/bin/clang++" >> $GITHUB_ENV
          mkdir -p ~/.R
          cat > ~/.R/Makevars <<'EOF'
          CC=$(brew --prefix llvm@18)/bin/clang
          CXX=$(brew --prefix llvm@18)/bin/clang++
          SHLIB_OPENMP_CFLAGS = -fopenmp
          SHLIB_OPENMP_CXXFLAGS = -fopenmp
          LDFLAGS += -L$(brew --prefix llvm@18)/lib -lomp
          EOF

      # ───── build source package ─────
      - name: Build source package
        run: R CMD build --no-build-vignettes --no-manual .
        working-directory: .

      # ───── build binary and upload for each platform ─────
      - name: Build & upload binary (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          R CMD INSTALL --build --no-build-vignettes --no-docs --no-html --no-multiarch *.tar.gz
        shell: bash
      - name: Upload macOS binary
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.r-version }}
          path: "*.tgz"

      - name: Build & upload binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          R CMD INSTALL --build --no-build-vignettes --no-docs --no-html --no-multiarch *.tar.gz
        shell: bash
      - name: Upload Windows binary
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.r-version }}
          path: "*.zip"

      - name: Upload source artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ matrix.r-version }}
          path: "*.tar.gz"


  deploy:
    needs: [build, pkgdown]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with: { ref: gh-pages }

      - name: Create pkgdown + binary dirs
        run: |
          mkdir -p docs \
                   bin/windows/contrib \
                   bin/macosx/contrib \
                   src/contrib

      - name: Fetch pkgdown site
        run: |
          git fetch origin gh-pages:gh-pages
          git worktree add site gh-pages
          cp -r site/* docs/
          rm -rf site

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: .

      - name: Generate PACKAGES indices
        run: |
          Rscript -e 'tools::write_PACKAGES("src/contrib", type="source")'
          Rscript -e 'tools::write_PACKAGES("bin/windows/contrib",    type="win.binary")'
          Rscript -e 'tools::write_PACKAGES("bin/macosx/contrib",    type="mac.binary")'

      - name: Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "🚀 Unified deploy [skip ci]"
            git push origin gh-pages
          else
            echo "No changes to commit."
          fi