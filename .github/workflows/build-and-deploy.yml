name: Build & Deploy R binaries

on:
  push:
    branches:
      - stable

permissions:
  contents: write
  actions: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
        r-version: ["4.5"]

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ matrix.r-version }}
        extra-repositories: "https://inla.r-inla-download.org/R/testing"

    - name: Install build deps
      run: Rscript -e 'install.packages(c("devtools"), repos="https://cloud.r-project.org")'

    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        dependencies: '"all"'

    - name: Install LLVM (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        brew install llvm

    - name: Configure LLVM and OpenMP for R (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        LLVM_PREFIX=$(brew --prefix llvm)
        RFW=$(R RHOME)

        echo "PATH=$LLVM_PREFIX/bin:$PATH" >> $GITHUB_ENV
        echo "CC=$LLVM_PREFIX/bin/clang" >> $GITHUB_ENV
        echo "CXX=$LLVM_PREFIX/bin/clang++" >> $GITHUB_ENV
        echo "CFLAGS=-fopenmp -I$RFW/include" >> $GITHUB_ENV
        echo "CXXFLAGS=-fopenmp -I$RFW/include" >> $GITHUB_ENV
        echo "LDFLAGS=-fopenmp -L$RFW/lib -Wl,-rpath,$RFW/lib" >> $GITHUB_ENV
        echo "DYLD_FALLBACK_LIBRARY_PATH=$RFW/lib:/usr/local/lib:/usr/lib" >> $GITHUB_ENV

        mkdir -p ~/.R
        echo "CXXFLAGS += -fopenmp -I$RFW/include" >> ~/.R/Makevars
        echo "CFLAGS   += -fopenmp -I$RFW/include" >> ~/.R/Makevars
        echo "LDFLAGS  += -fopenmp -L$RFW/lib -Wl,-rpath,$RFW/lib" >> ~/.R/Makevars

    - name: Build source package
      run: |
        R CMD build .
      shell: bash

    - name: Install from source without test-load (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        PKG=$(ls -t *.tar.gz | head -n 1)
        R CMD INSTALL --no-multiarch --no-test-load "$PKG"

    - name: Patch OpenMP paths after install (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        RFW=$(R RHOME)
        PKGPATH=$(Rscript -e 'cat(find.package("ngme2"))')
        echo "Package installed at: $PKGPATH"

        if [ -f "$PKGPATH/libs/ngme2.so" ]; then
          echo "Found ngme2.so at $PKGPATH/libs/ngme2.so"
          otool -L "$PKGPATH/libs/ngme2.so"

          echo "Patching ngme2.so install_name..."
          install_name_tool -change @rpath/libomp.dylib "$RFW/lib/libomp.dylib" "$PKGPATH/libs/ngme2.so" || true
          install_name_tool -change libomp.dylib "$RFW/lib/libomp.dylib" "$PKGPATH/libs/ngme2.so" || true
          install_name_tool -change @loader_path/libomp.dylib "$RFW/lib/libomp.dylib" "$PKGPATH/libs/ngme2.so" || true

          echo "Dependencies after patching:"
          otool -L "$PKGPATH/libs/ngme2.so"
        else
          echo "ngme2.so not found!"
          exit 1
        fi

    - name: Build binary package (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        PKG=$(ls -t *.tar.gz | head -n 1)
        R CMD INSTALL --build "$PKG"
      shell: bash

    - name: Upload macOS binary
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: binary-macos-r${{ matrix.r-version }}
        path: "*.tgz"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout gh-pages branch
      uses: actions/checkout@v3
      with:
        ref: gh-pages

    - name: Setup R
      uses: r-lib/actions/setup-r@v2

    - name: Create directory structure
      run: |
        mkdir -p .binaries/bin/macosx/big-sur-arm64/contrib/4.5
        mkdir -p .binaries/src/contrib

    - name: Download macOS binaries
      uses: actions/download-artifact@v4
      with:
        name: binary-macos-r4.5
        path: .binaries/bin/macosx/big-sur-arm64/contrib/4.5

    - name: Create .nojekyll
      run: touch .nojekyll

    - name: Generate PACKAGES indices
      run: |
        Rscript -e 'tools::write_PACKAGES(".binaries/src/contrib", type="source")'
        Rscript -e 'tools::write_PACKAGES(".binaries/bin/macosx/big-sur-arm64/contrib/4.5", type="mac.binary")'

    - name: Commit & Push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "🚀 Update binaries for $(date +%Y-%m-%d) [skip ci]" || echo "No changes to commit"
        git push origin gh-pages