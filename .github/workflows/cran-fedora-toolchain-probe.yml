name: Fedora C++ toolchain probes

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce the Rcpp ABI mismatch and validate a consistent ABI
        shell: bash
        run: |
          output="$RUNNER_TEMP/ngme2-toolchain-probes"
          mkdir -p "$output"
          docker build --platform linux/amd64 --progress plain \
            --file tools/cran-fedora-repro/Dockerfile.abi \
            --tag ngme2-toolchain-probes tools/cran-fedora-repro \
            2>&1 | tee "$output/build.log"
          set +e
          docker run --rm --init ngme2-toolchain-probes \
            timeout 60s Rscript /opt/ngme2/check-toolchain.R \
            > "$output/inconsistent-abi.log" 2>&1
          status=$?
          set -e
          printf 'Inconsistent ABI exit status: %s\n' "$status" \
            | tee "$output/inconsistent-abi-status.txt"
          cat "$output/inconsistent-abi.log"
          test "$status" -ne 0
          docker run --rm --init \
            --env R_MAKEVARS_USER=/opt/ngme2/Makevars.libstdcxx \
            ngme2-toolchain-probes \
            timeout 60s Rscript /opt/ngme2/check-toolchain.R \
            2>&1 | tee "$output/consistent-abi.log"
      - name: Reproduce the libc++ RNG warning and validate explicit discard
        shell: bash
        run: |
          output="$RUNNER_TEMP/ngme2-toolchain-probes"
          set +e
          docker run --rm --init ngme2-toolchain-probes \
            clang++ -stdlib=libc++ -std=c++17 -Wall -Werror=unused-result \
            /opt/ngme2/rng-discard-probe.cpp -o /tmp/rng-probe \
            > "$output/rng-original.log" 2>&1
          status=$?
          set -e
          cat "$output/rng-original.log"
          test "$status" -ne 0
          docker run --rm --init ngme2-toolchain-probes \
            sh -c 'clang++ -stdlib=libc++ -std=c++17 -Wall -Werror=unused-result -DNGME_EXPLICIT_DISCARD /opt/ngme2/rng-discard-probe.cpp -o /tmp/rng-probe && /tmp/rng-probe' \
            2>&1 | tee "$output/rng-fixed.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ngme2-toolchain-probes-${{ github.run_id }}
          path: ${{ runner.temp }}/ngme2-toolchain-probes/
          retention-days: 30
