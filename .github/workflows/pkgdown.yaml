name: pkgdown

on:
  push:
    branches:
      - stable

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-22.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          extra-repositories: "https://inla.r-inla-download.org/R/testing"

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies on Linux (GL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y && sudo apt-get install -y libglu1-mesa-dev
          
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: |
             pkgdown

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      - name: Install package
        run: R CMD INSTALL .

      - name: Deploy package
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          
          # Build and deploy site
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE)'
          
          # Make sure we are up-to-date
          git fetch origin
          git checkout gh-pages
          
          # Clean untracked files if any (optional but safer)
          git clean -fd
          
          # Add all updated files (important!)
          git add .

          # Only commit if there is anything to commit
          if ! git diff --cached --quiet; then
            git commit -m "Update pkgdown site [skip ci]"
            git push origin gh-pages
          else
            echo "No changes to commit."
          fi
