url: https://davidbolin.github.io/ngme2/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    heading_font: {google: "Roboto Slab"}

navbar:
  bg: primary
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github, twitter]
  components:
    reference:
      text: Functions
      href: reference/index.html
    articles:
      text: Vignettes
      menu:
      - text: Installation and configuration (using OpenMP)
        href: articles/Installation_and_configuration.html
      - text: AR(1) model
        href: articles/AR1-model.html
      - text: Random walk model
        href: articles/RW-model.html
      - text: Ornstein-Uhlenbeck process
        href: articles/ou-process.html
      - text: SPDE Matern model
        href: articles/SPDE-model.html
      - text: Models with Combined Gaussian and NIG Noise 
        href: articles/normal-nig-noise.html
      - text: Models with replicates
        href: articles/replicate.html
      - text: Model estimation and prediction
        href: articles/pred-and-est.html
      - text: Bivariate models in Ngme2
        href: articles/bivariate.html
      - text: Random effects model in Ngme2
        href: articles/random-effect.html
      - text: Space-time (tensor product) model in Ngme2
        href: articles/tensor-product.html
      - text: Matern SPDE model on Metric Graph
        href: articles/matern-on-graph.html
      - text: Cross-validation for the ngme2 models
        href: articles/cross-validation.html
      - text: Using the Generic Model in ngme2
        href: articles/generic.html
      exclude:
        - AGENTS.md
    github:
      icon: fa-github
      href: https://github.com/davidbolin/ngme2
      aria-label: Github
    twitter:
      icon: fa-twitter
      href: https://twitter.com/jdavidbolin
      aria-label: Twitter

home:
  links:
  - text: Browse source code
    href: https://github.com/davidbolin/ngme2
  - text: Report a bug
    href: https://github.com/davidbolin/ngme2/issues
  - text: Our research group
    href: http://stochproc.kaust.edu.sa/

